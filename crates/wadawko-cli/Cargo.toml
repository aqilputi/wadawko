[package]
name = "wadawko-cli"
description = "WaDAWko — utilitário de linha de comando (list/export/render/import/import-backup)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "wadawko-cli"
path = "src/main.rs"

[dependencies]
wadawko-core = { path = "../wadawko-core" }
wadawko-store = { path = "../wadawko-store" }
wadawko-export = { path = "../wadawko-export" }
wadawko-audio = { path = "../wadawko-audio" }
wadawko-samples = { path = "../wadawko-samples" }
anyhow = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
