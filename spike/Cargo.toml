[package]
name = "wadawko-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.9.1"
cpal = "0.18"
rtrb = "0.3"
anyhow = "1"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
