# WaDAWko nativo — workspace (docs/planejamento/gpui.md §3.1)
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/aqilputi/wadawko"

# versões compartilhadas
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
gpui-kit = "=0.9.1"
cpal = "0.18"
rtrb = "0.3"
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
